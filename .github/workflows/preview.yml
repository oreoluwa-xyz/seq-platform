name: Build and release SEQ preview
on:
  workflow_dispatch:
  push:
    tags: ['v*']
concurrency:
  group: seq-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test release validation
        run: python -m unittest discover -s tools -p 'test_release_assets.py'
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('apps/desktop/package.json').read_text())['version']
          lock = json.loads(Path('apps/desktop/package-lock.json').read_text())
          assert lock['version'] == version == lock['packages']['']['version'], 'Package versions differ'
          if os.environ['REF_TYPE'] == 'tag':
              tag = os.environ['REF_NAME']
              assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag), 'Use vMAJOR.MINOR.PATCH tags'
              assert tag == 'v' + version, 'Tag must match desktop package version'
          PYTHON
  firmware:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned backend
        run: python tools/workspace.py prepare
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util clang
          python -m pip install qmk==1.1.8 -r .work/qmk/requirements.txt
      - name: Run firmware and UI regression tests
        run: |
          sh .work/qmk/keyboards/keychron/v1_max/ansi_encoder/keymaps/seq_test/tests/seq_engine/run.sh
          python -m unittest discover -s .work/qmk/keyboards/keychron/v1_max/ansi_encoder/keymaps/seq_test/tools -p 'test_*.py'
      - name: Build firmware from this commit
        run: |
          python tools/workspace.py firmware
          sha256sum dist/firmware.bin > dist/firmware.sha256
          git rev-parse HEAD > dist/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 3
          if-no-files-found: error
  desktop:
    needs: firmware
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/
      - name: Verify firmware transfer and prepare backend
        run: |
          shasum -a 256 -c dist/firmware.sha256
          test "$(cat dist/source-commit.txt)" = "$(git rev-parse HEAD)"
          python tools/workspace.py prepare
          python tools/workspace.py register --image dist/firmware.bin
      - name: Test and package
        run: |
          python -m pip install pyinstaller==6.22.3
          export SEQ_BUILD_PYTHON="$(command -v python)"
          export SEQ_FIRMWARE_ID="$(shasum -a 256 dist/firmware.bin | cut -d ' ' -f 1)"
          DESKTOP=.work/qmk/keyboards/keychron/v1_max/ansi_encoder/keymaps/seq_test/desktop
          npm ci --prefix "$DESKTOP"
          npm test --prefix "$DESKTOP"
          python tools/workspace.py package --firmware-id "$SEQ_FIRMWARE_ID"
      - name: Smoke-test standalone app
        run: |
          APP="$GITHUB_WORKSPACE/.work/qmk/keyboards/keychron/v1_max/ansi_encoder/keymaps/seq_test/desktop/dist/mac-arm64/SEQ.app/Contents/MacOS/SEQ"
          cd "$RUNNER_TEMP"
          PATH=/usr/bin:/bin SEQ_DESKTOP_PORT=18766 "$APP" --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: seq-macos-preview
          path: dist/
          retention-days: 3
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seq-macos-preview
          path: artifacts/
      - name: Verify and prepare release assets
        run: |
          python tools/release_assets.py --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" --artifacts artifacts --destination release-assets --notes release-notes.md
      - name: Upload draft and publish preview
        run: |
          # Published releases are immutable in this workflow. A failed draft upload can be retried.
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Release already published; use a new version"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --title "SEQ $RELEASE_TAG preview" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
